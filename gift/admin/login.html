<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>선물상자 관리자 로그인</title>
  <!-- 인증 전에는 관리자 JS/CSS(/admin-assets)를 받을 수 없어서, 로그인 화면은 이 파일 하나로 완결됩니다. -->
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 0%, #1c1710, #07070a 70%);
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      color: #f5f1e6;
    }
    form {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(232, 191, 106, 0.3);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
    }
    h1 { margin: 0 0 6px; font-size: 22px; color: #fff3d1; }
    p { margin: 0 0 20px; font-size: 14px; color: rgba(245, 241, 230, 0.6); line-height: 1.5; }
    input, button {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
    }
    input {
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.35);
      color: inherit;
    }
    input:focus { outline: 2px solid #e8bf6a; border-color: transparent; }
    button {
      margin-top: 12px;
      border: 0;
      font-weight: 700;
      background: linear-gradient(180deg, #fff3d1, #e8bf6a 45%, #a9772c);
      color: #2a1606;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { min-height: 20px; margin-top: 12px; font-size: 14px; color: #ff8a8a; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h1>🎁 선물상자 관리자</h1>
    <p>서버 .env 파일의 OPERATOR_TOKEN 값을 입력해주세요.</p>
    <input type="password" id="token" autocomplete="current-password" placeholder="운영자 키" required autofocus />
    <button type="submit" id="submit">로그인</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const submitEl = document.getElementById('submit');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      submitEl.disabled = true;
      try {
        const res = await fetch('/api/gift/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: document.getElementById('token').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || '로그인에 실패했습니다.');
        window.location.reload();
      } catch (error) {
        errorEl.textContent = error.message;
        submitEl.disabled = false;
      }
    });
  </script>
</body>
</html>
